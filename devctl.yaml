{
  "apiVersion": "devctl.design-intelligence/v2",
  "kind": "DevelopmentControlPlane",
  "metadata": {
    "name": "youth-sports-platform-mvp-v3",
    "owner": "repository",
    "phase": "0-5"
  },
  "spec": {
    "authorities": [
      {
        "id": "agents",
        "kind": "instructions",
        "path": "AGENTS.md",
        "trust": "repository-governance"
      },
      {
        "id": "claude",
        "kind": "instructions",
        "path": "CLAUDE.md",
        "trust": "repository-governance"
      },
      {
        "id": "docs-adr-0002-server-side-event-change-receipts",
        "kind": "architecture",
        "path": "docs/adr/0002-server-side-event-change-receipts.md",
        "trust": "domain-authority"
      },
      {
        "id": "docs-backlog-next",
        "kind": "backlog",
        "path": "docs/backlog-next.md",
        "trust": "approved-task"
      },
      {
        "id": "docs-backlog-now",
        "kind": "backlog",
        "path": "docs/backlog-now.md",
        "trust": "approved-task"
      },
      {
        "id": "changelog",
        "kind": "change-log",
        "path": "CHANGELOG.md",
        "trust": "institutional-memory"
      }
    ],
    "context": {
      "maxBytes": 192000,
      "maxFiles": 20,
      "neverAutoLoad": [
        ".env*",
        "**/.env*",
        "**/*credential*",
        "**/*secret*",
        ".git/**",
        "node_modules/**"
      ]
    },
    "design": {
      "enabled": false,
      "triggerPaths": [
        "app/**",
        "components/**",
        "pages/**",
        "src/**",
        "styles/**",
        "tests/fixtures/visual-surface/**"
      ]
    },
    "discovery": {
      "existingDesignMemory": true,
      "frontend": "Next.js",
      "repositoryMaturity": "PARTIAL"
    },
    "instructions": {
      "adapters": [],
      "root": "AGENTS.md"
    },
    "planes": {
      "architecture": {
        "adrGlobs": [],
        "authorityPaths": [
          "docs/adr/0002-server-side-event-change-receipts.md"
        ],
        "boundaryChecks": [],
        "contractPaths": [
          "package.json"
        ],
        "enabled": false,
        "impactGraph": {
          "codeowners": [
            ".github/CODEOWNERS",
            "CODEOWNERS"
          ],
          "enabled": true,
          "exclude": [
            ".env*",
            "**/.env*",
            "**/*credential*",
            "**/*secret*",
            ".git/**",
            "node_modules/**",
            ".venv/**",
            "artifacts/**",
            "**/__pycache__/**",
            "**/*.pyc"
          ],
          "include": [
            "app/**",
            "components/**",
            "pages/**",
            "src/**",
            "styles/**",
            "tests/fixtures/visual-surface/**",
            "design_intelligence/**",
            "scripts/**",
            "tests/**",
            "*.json",
            "*.toml",
            "*.yaml"
          ],
          "journeyBindings": [],
          "maxDepth": 4,
          "maxImpactNodes": 300,
          "maxNodes": 5000,
          "maxSourceFiles": 2000,
          "ownershipRules": [],
          "securityRules": []
        },
        "maxReviewAgeDays": 90,
        "standardsProfile": ".dev/standards-profile.json",
        "technologyCurrency": {
          "evidence": [],
          "manifests": [
            "package.json",
            "package-lock.json"
          ],
          "policy": "contextual-not-latest",
          "reviewAfter": "2026-09-12",
          "reviewedAt": "2026-09-12"
        }
      },
      "intelligence": {
        "enabled": false,
        "instructionPaths": [
          "AGENTS.md",
          "CLAUDE.md"
        ],
        "rolePaths": [],
        "routingPolicy": ".dev/model-routing.json",
        "skillRoots": [
          ".agents/skills"
        ]
      },
      "intent": {
        "backlog": {
          "completionPolicy": "all-terminal",
          "dependencies": {},
          "draftingPolicy": {
            "requireAcceptanceContract": true,
            "requireAuthorityBoundaries": true,
            "requireExplicitDependencies": true,
            "requireVerification": true
          },
          "sources": [
            {
              "includeInCompletion": true,
              "parser": "markdown-headings",
              "path": "docs/backlog-now.md",
              "requireItems": true,
              "role": "active"
            },
            {
              "includeInCompletion": true,
              "parser": "markdown-headings",
              "path": "docs/backlog-next.md",
              "requireItems": true,
              "role": "staged"
            }
          ],
          "terminalStatuses": [
            "COMPLETED",
            "CANCELLED",
            "DEFERRED_WITH_AUTHORITY"
          ]
        },
        "enabled": false,
        "index": ".dev/intent-index.json",
        "journeyRequiredPaths": [
          "app/**",
          "components/**",
          "pages/**",
          "src/**",
          "styles/**",
          "tests/fixtures/visual-surface/**"
        ],
        "maxReviewAgeDays": 180
      }
    },
    "tasks": {
      "root": ".dev/tasks"
    },
    "verification": {
      "commands": {
        "build": [
          "npm",
          "run",
          "build"
        ],
        "lint": [
          "npm",
          "run",
          "lint"
        ],
        "test": [
          "npm",
          "run",
          "test"
        ],
        "typecheck": [
          "npm",
          "run",
          "typecheck"
        ]
      },
      "rules": []
    }
  }
}
