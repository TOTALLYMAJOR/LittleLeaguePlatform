name: Production smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Governance authority (reporting only)
        run: npm run check:governance
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Validate Compose config
        run: docker compose config --quiet
      - name: Build and start
        run: docker compose up -d --build
      - name: Smoke check
        run: |
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 http://localhost:8081/ || true)"
            if [ "$status" = "200" ]; then
              echo "Application became ready on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt returned ${status:-unreachable}; retrying in 2 seconds."
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs web
      - name: Stop
        if: always()
        run: docker compose down
