version: 1

repository:
  name: LeaguePilot
  base_branch: main

backlog:
  path: BACKLOG.md

workers:
  maximum: 3

contracts:
  roots:
    - lib/domain/
    - lib/supabase/
    - supabase/migrations/

validation:
  task_default:
    - npm ci --ignore-scripts --prefer-offline
    - npm run check:skills
    - npm run lint
    - npm run typecheck
    - git diff --check
  integration:
    - npm ci --ignore-scripts --prefer-offline
    - npm run check:skills
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run build
    - npm audit --omit=dev
    - git diff --check

docker:
  enabled: false
  compose_file: docker-compose.yml

git:
  remote: origin
  push_task_branches: false
  push_integration_branch: false
  open_integration_pull_request: false
